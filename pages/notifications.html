<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notifications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script>try{var t=localStorage.getItem("onecore:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}try{var b=JSON.parse(localStorage.getItem("onecore_saved_brand_last")||"null");if(b&&b.css&&!/<|url\(|@import/i.test(b.css)){var s=document.createElement("style");s.id="brand-theme";s.textContent=b.css;document.head.appendChild(s)}}catch(e){}</script>
</head>
<body>
<div id="page-loader" class="page-loader">
  <div class="page-loader-decor-top"></div>
  <svg class="page-loader-ring" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="loaderGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2952e3" />
        <stop offset="100%" stop-color="#1fc6c6" />
      </linearGradient>
    </defs>
    <circle cx="25" cy="25" r="20" fill="none" stroke="url(#loaderGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 40" />
  </svg>
  <div class="page-loader-text">LOADING&hellip;</div>
  <div class="page-loader-wave">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="loaderWaveGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1f4fe0" />
          <stop offset="100%" stop-color="#22c9c9" />
        </linearGradient>
      </defs>
      <path d="M0,140 C240,40 420,220 720,120 C1000,30 1200,200 1440,90 L1440,260 L0,260 Z" fill="#cfe0ff" />
      <path d="M0,180 C260,100 460,240 760,150 C1040,70 1220,220 1440,140 L1440,260 L0,260 Z" fill="url(#loaderWaveGradient)" />
    </svg>
  </div>
</div>
  <div id="page-content">
    <div class="page-intro-row">
      <p class="text-muted" id="unread-summary">Loading…</p>
      <div style="display:flex;gap:6px;">
        <button type="button" class="icon-action" id="mark-all-btn" title="Mark all as read" aria-label="Mark all as read">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/><path d="M20 12L9 23"/></svg>
        </button>
        <button type="button" class="icon-action danger" id="clear-btn" title="Clear all notifications" aria-label="Clear all notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      </div>
    </div>
    <div id="notifications-list" class="card"><div class="skeleton" style="height:60px;"></div></div>
  </div>

  <script type="module" src="../js/notifications.js"></script>
</body>
</html>
