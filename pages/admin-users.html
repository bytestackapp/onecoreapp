<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    /* Search + role filter row: minmax(0, ...) lets the columns shrink so nothing overflows the screen */
    .user-filters { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; margin: 0 0 12px; }
    .user-filters input, .user-filters select { display: block; width: 100%; min-width: 0; box-sizing: border-box; padding: 10px 14px; border: 1px solid rgba(128,128,128,.35); border-radius: 10px; background: transparent; color: inherit; font: inherit; }

    /* Keep user cards inside the screen on phones: the text column shrinks, the action icons stay on the same row */
    #users-list { max-width: 100%; overflow-x: hidden; }
    .user-meta { flex: 1 1 0; min-width: 0; }
    .user-name, .user-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-actions { flex-shrink: 0; flex-wrap: nowrap; }

    /* Linked Student modal */
    .linked-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .linked-head h3 { margin: 0; }
    .picker-scroll { max-height: 50vh; overflow-y: auto; margin-top: 8px; }
    .picker-table { width: 100%; border-collapse: collapse; }
    .picker-table th { position: sticky; top: 0; background: var(--card-bg, #fff); text-align: left; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; opacity: .65; padding: 8px 6px; border-bottom: 1px solid rgba(128,128,128,.3); }
    .picker-table td { padding: 8px 6px; border-bottom: 1px solid rgba(128,128,128,.18); }
    .picker-table .picker-action { width: 1%; white-space: nowrap; text-align: right; }
  </style>
</head>
<body>
<div id="page-loader" class="page-loader">
  <div class="page-loader-decor-top"></div>
  <svg class="page-loader-ring" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="loaderGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2952e3" />
        <stop offset="100%" stop-color="#1fc6c6" />
      </linearGradient>
    </defs>
    <circle cx="25" cy="25" r="20" fill="none" stroke="url(#loaderGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 40" />
  </svg>
  <div class="page-loader-text">LOADING&hellip;</div>
  <div class="page-loader-wave">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="loaderWaveGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1f4fe0" />
          <stop offset="100%" stop-color="#22c9c9" />
        </linearGradient>
      </defs>
      <path d="M0,140 C240,40 420,220 720,120 C1000,30 1200,200 1440,90 L1440,260 L0,260 Z" fill="#cfe0ff" />
      <path d="M0,180 C260,100 460,240 760,150 C1040,70 1220,220 1440,140 L1440,260 L0,260 Z" fill="url(#loaderWaveGradient)" />
    </svg>
  </div>
</div>
  <div id="page-content">
    <div id="users-list"><div class="skeleton" style="height:70px;"></div></div>
  </div>

  <script type="module" src="../js/admin-users.js"></script>
</body>
</html>
