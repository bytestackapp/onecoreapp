<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements</title>
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <div id="page-content">
    <div class="section-head" style="border-bottom:none;">
      <p class="text-muted mt-0">Announcements relevant to you.</p>
      <button class="btn btn-primary btn-sm" id="new-btn" style="display:none;">New announcement</button>
    </div>

    <div id="new-form-wrap" class="card" style="display:none;margin-bottom:20px;">
      <h3>New announcement</h3>
      <div id="form-error" class="banner banner-error" style="display:none;"></div>
      <form id="new-form">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" required maxlength="150" />
        </div>
        <div class="field">
          <label for="content">Content</label>
          <textarea id="content" rows="4" required></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="normal">Normal</option>
              <option value="important">Important</option>
              <option value="action_required">Action required</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="field">
            <label for="audience">Audience</label>
            <select id="audience">
              <option value="everyone">Everyone</option>
              <option value="teachers">Teachers</option>
              <option value="students">Students</option>
              <option value="parents">Parents</option>
              <option value="group">Specific group</option>
            </select>
          </div>
        </div>
        <div class="field" id="group-field" style="display:none;">
          <label for="group-select">Group</label>
          <select id="group-select"></select>
        </div>
        <div class="field">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
            <input type="checkbox" id="requires-ack" style="width:auto;" />
            Require acknowledgment
          </label>
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Publish</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

    <div id="announcements-list"><div class="skeleton" style="height:70px;margin-bottom:10px;"></div></div>
  </div>

  <script type="module" src="../js/announcements.js"></script>
</body>
</html>
