<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script src="../js/page-start.js" data-loader></script>
</head>
<body>
  <div id="page-content">
    <div class="section">
      <div id="export-head"></div>
      <div class="card">
        <p>Download attendance records for a date range as a CSV file you can open in Excel or Google Sheets.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="field" style="margin-bottom:0;">
            <label for="from-date">From</label>
            <input id="from-date" type="date" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="to-date">To</label>
            <input id="to-date" type="date" />
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div id="linked-head"></div>
      <div class="card">
        <p style="margin:0 0 8px;">Export the student-parent links to CSV for editing, then import the updated file to apply changes in bulk. File must contain at least Student and Parent columns.</p>
      </div>
    </div>
  </div>

  <script type="module" src="../js/reports.js"></script>
</body>
</html>
