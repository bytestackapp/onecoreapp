<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set a new password — OneCore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#2952e3" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script>try{if(localStorage.getItem("onecore:theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <h1>Set a new password</h1>
      <p class="subtitle">Choose a new password for your account.</p>

      <div id="error-banner" class="banner banner-error" style="display:none;"></div>

      <form id="update-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="8" autocomplete="new-password" required />
          <div class="field-hint">At least 8 characters.</div>
        </div>
        <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;">Update password</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase, friendlyError } from "../js/supabase-client.js";
    import "../js/theme.js";

    const form = document.getElementById("update-form");
    const errorBanner = document.getElementById("error-banner");
    const submitBtn = document.getElementById("submit-btn");

    // Supabase puts the recovery token in the URL hash and exchanges it
    // for a session automatically via onAuthStateChange("PASSWORD_RECOVERY").
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating…";

      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.updateUser({ password });

      submitBtn.disabled = false;
      submitBtn.textContent = "Update password";

      if (error) {
        errorBanner.textContent = friendlyError(error, "Unable to update your password. Please request a new reset link.");
        errorBanner.style.display = "flex";
        return;
      }
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
