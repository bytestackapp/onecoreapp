<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — OneCore</title>
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <h1>Reset your password</h1>
      <p class="subtitle">We'll email you a link to set a new password.</p>

      <div id="error-banner" class="banner banner-error" style="display:none;"></div>
      <div id="success-banner" class="banner banner-success" style="display:none;">
        Check your email for a reset link.
      </div>

      <form id="reset-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;">Send reset link</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Back to sign in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, friendlyError } from "../js/supabase-client.js";

    const form = document.getElementById("reset-form");
    const errorBanner = document.getElementById("error-banner");
    const successBanner = document.getElementById("success-banner");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";
      successBanner.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      const email = document.getElementById("email").value.trim();
      const redirectTo = `${window.location.origin}${window.location.pathname.replace("reset-password.html", "update-password.html")}`;

      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";

      if (error) {
        errorBanner.textContent = friendlyError(error, "Unable to send reset link. Please try again.");
        errorBanner.style.display = "flex";
        return;
      }
      successBanner.style.display = "flex";
      form.reset();
    });
  </script>
</body>
</html>
