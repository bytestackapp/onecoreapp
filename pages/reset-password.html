<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — OneCore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <h1>Reset your password</h1>
      <p class="subtitle">We'll email you a link to set a new password.</p>

      <div id="error-banner" class="banner banner-error" style="display:none;"></div>
      <div id="success-banner" class="banner banner-success" style="display:none;">
        Check your email for a reset link.
      </div>

      <form id="reset-form">
        <div class="field">
          <label for="email">Email</label>
          <div class="input-row">
            <input id="email" type="email" autocomplete="email" required />
            <div class="input-row-actions">
              <button class="icon-action primary" type="submit" id="submit-btn" title="Send reset link" aria-label="Send reset link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
          </div>
        </div>
      </form>

      <div class="auth-links" id="back-links" style="display:flex;justify-content:flex-end;visibility:hidden;">
        <a href="login.html" id="back-link">Back to sign in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, friendlyError } from "../js/supabase-client.js";

    const form = document.getElementById("reset-form");
    const emailInput = document.getElementById("email");
    const errorBanner = document.getElementById("error-banner");
    const successBanner = document.getElementById("success-banner");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";
      successBanner.style.display = "none";
      submitBtn.disabled = true;

      const email = emailInput.value.trim();
      const redirectTo = `${window.location.origin}${window.location.pathname.replace("reset-password.html", "update-password.html")}`;

      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

      submitBtn.disabled = false;

      if (error) {
        errorBanner.textContent = friendlyError(error, "Unable to send reset link. Please try again.");
        errorBanner.style.display = "flex";
        return;
      }
      successBanner.style.display = "flex";
      if (!emailInput.readOnly) form.reset(); // keep the pre-filled email for signed-in users
    });

    // Signed-in users arrive from Profile > Security; signed-out users from the login page.
    const backLink = document.getElementById("back-link");
    const backLinks = document.getElementById("back-links");
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        backLink.href = "profile.html";
        backLink.textContent = "Back to profile";

        const userEmail = session.user?.email;
        if (userEmail) {
          emailInput.value = userEmail;
          emailInput.readOnly = true;
        }
      }
    } finally {
      backLinks.style.visibility = "visible";
    }
  </script>
</body>
</html>
