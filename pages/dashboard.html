<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script>try{var t=localStorage.getItem("onecore:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <style>
    /* Clickable stat cards */
    .tile-link { display: block; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    .tile-link .stat-tile { height: 100%; box-sizing: border-box; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .tile-link:hover .stat-tile { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.10); }
    .tile-link:active .stat-tile { transform: translateY(0); }
    .tile-link:focus-visible { outline: 2px solid #2952e3; outline-offset: 2px; border-radius: 12px; }

    /* Stat cards: title on top (applies to every role) */
    .stat-tile .stat-label { font-weight: 600; margin: 0 0 12px; }
    .stat-tile .stat-value { line-height: 1.1; }
    
    /* Per-child status (parent dashboard) — theme-aware */
    .child-dots { display: flex; flex-wrap: wrap; gap: 12px; }
    .child-item { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
    .child-name {
      font-size: .72rem; color: var(--text-secondary);
      max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .child-dot {
      position: relative;
      width: 42px; height: 42px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font); font-size: .8rem; font-weight: 700; letter-spacing: .02em;
      border: 1.5px solid transparent;
    }
    .child-dot.is-in { background: var(--success-bg); color: var(--success-text); border-color: var(--success); }
    .child-dot.is-in::after {
      content: "✓"; position: absolute; right: -3px; bottom: -3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--success); color: var(--card);
      font-size: .62rem; font-weight: 800; line-height: 16px; text-align: center;
      border: 1.5px solid var(--card);
    }
    .child-dot.is-out { background: var(--tag-neutral-bg); color: var(--text-muted); border: 1.5px dashed var(--border-strong); }
    .child-empty { font-size: .85rem; color: var(--text-muted); }

    /* Pending Actions cards — same circle language as Children Monitoring */
    .pend-body { display: flex; align-items: center; gap: 12px; min-height: 48px; }
    .pend-sub { font-size: .78rem; color: var(--text-secondary); margin-top: 1px; }
    .pend-dot {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font); font-size: 1rem; font-weight: 700;
      border: 1.5px solid transparent;
    }
    .pend-dot svg { width: 18px; height: 18px; }
    .pend-dot.is-pending { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning); }
    .pend-dot.is-clear { background: var(--tag-neutral-bg); color: var(--text-muted); border: 1.5px dashed var(--border-strong); }
    .pend-text { flex: 1; min-width: 0; }
    .pend-main { font-size: .88rem; font-weight: 600; color: var(--text); }
    .pend-chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-muted); }
  </style>
</head>
<body>
<div id="page-loader" class="page-loader">
  <div class="page-loader-decor-top"></div>
  <svg class="page-loader-ring" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="loaderGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2952e3" />
        <stop offset="100%" stop-color="#1fc6c6" />
      </linearGradient>
    </defs>
    <circle cx="25" cy="25" r="20" fill="none" stroke="url(#loaderGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 40" />
  </svg>
  <div class="page-loader-text">LOADING&hellip;</div>
  <div class="page-loader-wave">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="loaderWaveGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1f4fe0" />
          <stop offset="100%" stop-color="#22c9c9" />
        </linearGradient>
      </defs>
      <path d="M0,140 C240,40 420,220 720,120 C1000,30 1200,200 1440,90 L1440,260 L0,260 Z" fill="#cfe0ff" />
      <path d="M0,180 C260,100 460,240 760,150 C1040,70 1220,220 1440,140 L1440,260 L0,260 Z" fill="url(#loaderWaveGradient)" />
    </svg>
  </div>
</div>
  <div id="page-content">
    <p id="welcome-line" class="text-muted mt-0" style="margin-bottom:1.25rem;">Loading your dashboard…</p>

    <div class="section" id="stats-section" style="display:none;">
      <div id="stats-head"></div>
      <div id="stat-tiles" class="grid-cards"></div>
    </div>

    <div class="section" id="children-section" style="display:none;">
      <div id="children-head"></div>
      <div id="children-tiles" class="grid-cards"></div>
    </div>

    <div class="section">
      <div id="announcements-head"></div>
      <div id="announcements-list" class="card"><div class="skeleton" style="height:60px;"></div></div>
    </div>

    <div class="section">
      <div id="events-head"></div>
      <div id="events-list" class="card"><div class="skeleton" style="height:60px;"></div></div>
    </div>

    <div id="role-section"></div>
  </div>

  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
