<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script src="../js/page-start.js" data-loader></script>
  <style>
    .info-row { padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
    .info-row:first-child { padding-top: 0; }
    .info-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .info-label { font-size: 0.78rem; opacity: .65; margin-bottom: 2px; }
    .info-value { font-weight: 600; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="page-content" style="max-width:520px;">
    <!-- Block 1: identity -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="avatar" id="profile-avatar" style="width:56px;height:56px;font-size:1.2rem;"></div>
        <div style="min-width:0;flex:1;">
          <h2 style="margin:0;" id="profile-name">—</h2>
          <div class="text-muted" id="profile-academy" style="font-size:0.82rem;margin-top:4px;"></div>
        </div>
        <span class="tag tag-normal" id="profile-role" style="align-self:flex-start;flex-shrink:0;">—</span>
      </div>
    </div>

    <!-- Block 2: basic information -->
    <div class="section" style="margin-top:16px;">
      <div id="basic-head"></div>
      <div class="card">
        <div class="info-row"><div class="info-label">Full name</div><div class="info-value" id="view-full-name">—</div></div>
        <div class="info-row"><div class="info-label">Email</div><div class="info-value" id="view-email">—</div></div>
        <div class="info-row"><div class="info-label">Phone</div><div class="info-value" id="view-phone">—</div></div>
      </div>
    </div>

    <!-- Linked students (parents, or anyone who has a linked student) -->
    <div class="section" id="linked-students-section" style="margin-top:16px;display:none;">
      <div id="linked-head"></div>
      <div class="card" id="linked-students-list"></div>
    </div>
	
	<!-- Find My Child: this phone's setup (students, inside the Android app only) -->
    <div class="section" id="fmc-device-section" style="margin-top:16px;display:none;">
      <div id="fmc-head"></div>
      <div class="card" id="fmc-device-card"></div>
    </div>

    <!-- Block 3: security -->
    <div class="section" style="margin-top:16px;">
      <div id="security-head"></div>
      <div class="card">
        <h3>Password</h3>
        <p>Update the password you use to sign in.</p>
        <a class="btn btn-secondary" href="reset-password.html">Send password reset email</a>
      </div>
      <!-- Fingerprint / face unlock: shown only inside the Android app, on a phone that has one set up -->
      <div class="card" id="biometric-card" style="margin-top:12px;display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <h3 style="margin:0;">Fingerprint / face unlock</h3>
          <span id="biometric-badge" style="flex-shrink:0;padding:2px 10px;border-radius:999px;font-size:0.78rem;font-weight:700;"></span>
        </div>
        <p id="biometric-desc" style="margin-top:8px;">Use your phone's fingerprint or face unlock to open OneCore, instead of signing in with your password again.</p>
        <button type="button" class="btn btn-secondary" id="biometric-btn">Activate</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/profile.js"></script>
</body>
</html>
