<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>People</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script src="../js/page-start.js" data-loader></script>
</head>
<body>
  <div id="page-content">
    <div class="card" style="margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;">
        <div class="field" style="margin-bottom:0;">
          <label for="search">Search</label>
          <input id="search" style="width:100%;min-width:0;box-sizing:border-box;" placeholder="Search by name or email…" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="role-filter">Role</label>
          <select id="role-filter" style="width:100%;min-width:0;box-sizing:border-box;">
            <option value="">All roles</option>
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
			<option value="guest">Guest</option>
          </select>
        </div>
      </div>
    </div>

    <div id="people-list"><div class="skeleton" style="height:70px;margin-bottom:10px;"></div></div>
  </div>

  <script type="module" src="../js/people.js"></script>
</body>
</html>
