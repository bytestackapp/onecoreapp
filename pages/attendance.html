<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script src="../js/page-start.js" data-loader></script>
</head>
<body>
  <div id="page-content">

    <!-- Staff: read-only view of today's scanner records -->
    <div id="clock-section" class="section" style="display:none;">
      <div class="section-head tone-primary">
        <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <h2>Today</h2>
      </div>
      <div class="card">
        <div id="clock-status" class="grid-cards" style="grid-template-columns:repeat(2,1fr);margin-bottom:0;"></div>
        <p id="clock-note" class="text-muted" style="font-size:0.8rem;margin:12px 0 0;"></p>
      </div>
    </div>

    <!-- Teacher / admin: backup view of who has checked in -->
    <div id="rollcall-section" class="section" style="display:none;">
      <div class="section-head tone-info">
        <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg></span>
        <h2>Class attendance</h2>
        <button type="button" class="icon-action sm" id="rollcall-show" title="View class list" aria-label="View class list" style="margin-left:auto;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end;">
          <div class="field" style="margin-bottom:0;">
            <label for="rollcall-group">Class</label>
            <select id="rollcall-group"></select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="rollcall-date">Date</label>
            <input id="rollcall-date" type="date" />
          </div>
        </div>
        <p id="rollcall-hint" class="text-muted" style="font-size:0.8rem;margin:12px 0 0;">Choose a class and a date, then tap the eye icon to see who has checked in.</p>
      </div>
    </div>

    <!-- Attendance corrections: pending requests (admins review them here) -->
    <div id="corrections-section" class="section">
      <div class="section-head tone-info">
        <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
        <h2>Attendance correction</h2>
        <button type="button" class="icon-action sm" id="corrections-view-btn" title="View all requests" aria-label="View all correction requests" style="margin-left:auto;display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="corrections-list" class="card"><div class="skeleton" style="height:60px;"></div></div>
    </div>

    <!-- Parent: children's arrival and departure log -->
    <div id="children-section" class="section" style="display:none;">
      <div class="section-head tone-info">
        <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></span>
        <h2>Your children</h2>
      </div>
      <div id="children-list"></div>
    </div>

    <div id="history-section" class="section">
      <div class="section-head tone-info">
        <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></span>
        <h2>My attendance history</h2>
        <button type="button" class="icon-action sm" id="history-view-btn" title="View all history" aria-label="View all history" style="margin-left:auto;display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="history-list" class="card"><div class="skeleton" style="height:60px;"></div></div>
    </div>

  </div>

  <script type="module" src="../js/attendance.js"></script>
</body>
</html>
