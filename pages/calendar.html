<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneCore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#2952e3" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <script>try{var t=localStorage.getItem("onecore:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <style>
    :root { --note:#7c5cd6; }
    :root[data-theme="dark"] { --note:#a78bfa; }
    .cal-wrap { max-width:640px; margin:0 auto; }
    .cal-top { display:flex; align-items:center; justify-content:space-between; position:relative; margin-bottom:6px; }
    .cal-view-name { font-size:0.85rem; color:var(--text-secondary); }
    .gear { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--input-bg); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); padding:0; }
    .gear svg { width:18px; height:18px; }
    .cal-menu { display:none; position:absolute; top:42px; right:0; z-index:20; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:6px; min-width:170px; box-shadow:0 6px 20px rgba(0,0,0,0.12); }
    .cal-menu.on { display:block; }
    .cal-menu-h { font-size:0.7rem; color:var(--text-muted); padding:4px 10px; }
    .cal-menu button { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:none; border:0; text-align:left; font:inherit; font-size:0.9rem; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--text); }
    .cal-menu button:hover { background:var(--bg); }
    .cal-menu button.on::after { content:"\2713"; color:var(--primary); font-weight:700; }
    .cal-menu button.danger { color:var(--error); }

    .cal-legend { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 4px; font-size:0.76rem; color:var(--text-secondary); }
    .cal-legend span { display:inline-flex; align-items:center; gap:5px; }
    .cal-legend i { display:inline-block; width:9px; height:9px; border-radius:50%; }
    .cal-nav { display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
    .cal-nav strong { font-size:1rem; }

    .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); row-gap:4px; text-align:center; }
    .cal-dow { font-size:0.72rem; color:var(--text-muted); padding-bottom:4px; }
    .cal-cell { display:flex; flex-direction:column; align-items:center; background:none; border:0; padding:0; font:inherit; color:var(--text); cursor:pointer; }
    .cal-num { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.9rem; border:1.5px solid transparent; }
    .cal-cell.other-month .cal-num { color:var(--text-muted); }
    .cal-cell.has-events .cal-num { background:var(--info-bg); }
    .cal-cell.has-leave .cal-num { background:var(--warning-bg); }
    .cal-cell.att-present .cal-num { color:var(--success); font-weight:700; }
    .cal-cell.att-absent .cal-num { color:var(--error); font-weight:700; }
    .cal-cell.today .cal-num { border-color:var(--primary); }
    .cal-cell.sel .cal-num { background:var(--primary-solid); border-color:var(--primary-solid); color:#fff; }

    .wk-strip { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
    .wk-pill { display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:8px 0 4px; font:inherit; color:var(--text); cursor:pointer; }
    .wk-l { font-size:0.72rem; color:var(--text-secondary); }
    .wk-dot { width:5px; height:5px; border-radius:50%; background:transparent; }
    .wk-dot.on { background:var(--note); }
    .wk-n { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.88rem; border:1.5px solid transparent; }
    .wk-n.today { border-color:var(--primary); }
    .wk-pill.sel .wk-n { background:var(--primary-solid); border-color:var(--primary-solid); color:#fff; }

    .day-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:28px 0 8px; font-weight:700; font-size:0.95rem; }
    .day-head small { font-size:0.76rem; font-weight:400; color:var(--text-secondary); }
    .day-actions { display:flex; align-items:center; gap:6px; position:relative; }
    .cal-pb { background:var(--primary-solid);; color:#fff; border:0; border-radius:999px; padding:6px 14px; font:inherit; font-size:0.82rem; font-weight:600; cursor:pointer; }
    .cal-dots { width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--input-bg); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; color:var(--text); }
    .cal-private { font-size:0.76rem; color:var(--text-secondary); display:flex; align-items:center; gap:4px; margin:-2px 0 10px; }
    .ag-date { font-size:0.8rem; color:var(--text-secondary); margin:14px 0 6px; }

    .cd { display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; text-decoration:none; color:inherit; text-align:left; font:inherit; cursor:pointer; }
    .cd-bar { width:4px; align-self:stretch; border-radius:2px; flex-shrink:0; }
    .cd-tx { flex:1; min-width:0; display:flex; flex-direction:column; }
    .cd-t { font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cd-s { font-size:0.8rem; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cd-chev { color:var(--text-muted); flex-shrink:0; display:flex; }
    .cd-chev svg { width:16px; height:16px; }
    .note-err { color:var(--error); font-size:0.8rem; margin-top:6px; min-height:1em; }
  </style>
</head>
<body>
<div id="page-loader" class="page-loader">
  <div class="page-loader-decor-top"></div>
  <svg class="page-loader-ring" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="loaderGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2952e3" />
        <stop offset="100%" stop-color="#1fc6c6" />
      </linearGradient>
    </defs>
    <circle cx="25" cy="25" r="20" fill="none" stroke="url(#loaderGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 40" />
  </svg>
  <div class="page-loader-text">LOADING&hellip;</div>
  <div class="page-loader-wave">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="loaderWaveGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1f4fe0" />
          <stop offset="100%" stop-color="#22c9c9" />
        </linearGradient>
      </defs>
      <path d="M0,140 C240,40 420,220 720,120 C1000,30 1200,200 1440,90 L1440,260 L0,260 Z" fill="#cfe0ff" />
      <path d="M0,180 C260,100 460,240 760,150 C1040,70 1220,220 1440,140 L1440,260 L0,260 Z" fill="url(#loaderWaveGradient)" />
    </svg>
  </div>
</div>
  <div id="page-content">
    <div class="cal-wrap">
      <div class="cal-top">
        <span class="cal-view-name" id="view-name"></span>
        <button type="button" class="gear" id="gear-btn" title="Calendar settings" aria-label="Calendar settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div class="cal-menu" id="view-menu" role="menu">
          <div class="cal-menu-h">View</div>
          <button type="button" role="menuitem" data-view="month">Month</button>
          <button type="button" role="menuitem" data-view="week">Week</button>
          <button type="button" role="menuitem" data-view="agenda">Agenda</button>
        </div>
      </div>
      <div class="cal-legend" id="legend"></div>
      <div id="cal-view"><div class="skeleton" style="height:320px;"></div></div>
    </div>
  </div>

  <script type="module" src="../js/calendar.js"></script>
</body>
</html>
