<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneCore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="css/global.css" />
  <script>try{var h=location.hostname.toLowerCase(),sl=null;try{var q=new URLSearchParams(location.search).get("school");if(q)sessionStorage.setItem("onecore_school_override",q.trim().toLowerCase());sl=sessionStorage.getItem("onecore_school_override")}catch(e){}var l=h.split(".");if(!sl&&l.length>=3&&l[0]!=="www")sl=l[0];if(sl&&!/^[a-z0-9-]{2,40}$/.test(sl))sl=null;var c=JSON.parse(localStorage.getItem("onecore_brand_v1:"+h+"|"+(sl||""))||"null");if(!(c&&c.matched))c=JSON.parse(localStorage.getItem("onecore_device_brand")||"null");if(c&&c.css&&!/<|url\(|@import/i.test(c.css)){var s=document.createElement("style");s.id="brand-theme";s.textContent=c.css;document.head.appendChild(s)}}catch(e){}</script>
  <style>
    #splashOverlay {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.4s ease;
      padding-bottom: 80px;
    }
    #splashOverlay.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-decor-top {
      position: absolute;
      top: -140px;
      left: -120px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--splash-decor-a, #dbe8ff), var(--splash-decor-b, #eef4ff));
      z-index: 0;
    }
    .splash-logo {
      width: 180px;
      max-width: 50vw;
      z-index: 1;
      position: relative;
    }
    .splash-brand-name {
      margin-top: 14px;
      z-index: 1;
      position: relative;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      padding: 0 24px;
    }
    .splash-bar {
      margin-top: 32px;
      width: 180px;
      height: 6px;
      border-radius: 3px;
      background: var(--splash-track, rgba(41, 82, 227, 0.15));
      overflow: hidden;
      position: relative;
      z-index: 1;
      transform: translateY(-18px);
    }
    .splash-bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      border-radius: 3px;
      background:
        linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.65) 50%, transparent 100%) -60px 0 / 60px 100% no-repeat,
        linear-gradient(90deg, var(--splash-a, #2952e3), var(--splash-b, #1fc6c6));
    }
    #splashOverlay.run .splash-bar::after {
      animation:
        splashFill var(--splash-ms, 5000ms) linear forwards,
        splashShine 1.1s linear infinite;
    }
    @keyframes splashFill {
      0%   { width: 0; }
      20%  { width: 18%; }
      55%  { width: 62%; }
      80%  { width: 86%; }
      100% { width: 100%; }
    }
    @keyframes splashShine {
      from { background-position: -60px 0, 0 0; }
      to   { background-position: calc(100% + 60px) 0, 0 0; }
    }
    .splash-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      line-height: 0;
      z-index: 0;
    }
	
	.splash-version {
      position: absolute;
      bottom: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.9);
      z-index: 2;
    }

    .splash-powered {
      position: absolute;
      bottom: 150px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: #334155;
    }
    .splash-powered img {
      height: 22px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div id="splashOverlay">
      <div class="splash-decor-top"></div>
      <img id="splashLogo" alt="OneCore" class="splash-logo" style="visibility:hidden" />
      <div id="splashBrandName" class="splash-brand-name" style="display:none"></div>
      <div class="splash-bar"></div>
      <div class="splash-wave">
        <svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" style="stop-color:var(--splash-a, #1f4fe0)" />
              <stop offset="100%" style="stop-color:var(--splash-b, #22c9c9)" />
            </linearGradient>
          </defs>
          <path d="M0,140 C240,40 420,220 720,120 C1000,30 1200,200 1440,90 L1440,260 L0,260 Z" style="fill:var(--splash-soft, #cfe0ff)" />
          <path d="M0,180 C260,100 460,240 760,150 C1040,70 1220,220 1440,140 L1440,260 L0,260 Z" fill="url(#waveGradient)" />
        </svg>
      </div>
      <div id="splashPowered" class="splash-powered" style="display:none">
        <span>Powered by:</span>
        <img src="images/logo-horiz.png" alt="OneCore" />
      </div>

	  <div class="splash-version">
        <div id="splashVersion"></div>	  
        <div>&copy; <span id="splashYear">2026</span> Bytestack. All Rights Reserved.</div>
      </div>
    </div>
  </div>
  <script type="module">
    import { getSessionUser } from "./js/supabase-client.js";
	import { APP_VERSION } from "./js/version.js";
    import { loadPublicBrand, getCachedBrand, applyBrand, brandLogo } from "./js/brand.js";

    document.getElementById("splashVersion").textContent = `Version ${APP_VERSION}`;

    const MIN_SPLASH_MS = 5000;
    const FADE_MS = 400;
    const start = Date.now();
    const overlay = document.getElementById("splashOverlay");
    overlay.style.setProperty("--splash-ms", MIN_SPLASH_MS + "ms");
    overlay.classList.add("run");

    function finish(target) {
      const elapsed = Date.now() - start;
      const wait = Math.max(0, MIN_SPLASH_MS - elapsed);
      setTimeout(() => {
        overlay.classList.add("hide");
        setTimeout(() => window.location.replace(target), FADE_MS);
      }, wait);
    }

    // Show this client's logo and name. A saved copy shows instantly; on the very first
    // visit the logo area waits for the server (never flashes the wrong brand).
    function showBrand(brand) {
      applyBrand(brand);
      document.title = brand.name;
      const logo = document.getElementById("splashLogo");
      const src = brandLogo(brand, "vert", "images/logo.png");
      if (src) {
        logo.src = src;
        logo.alt = brand.name;
        logo.style.visibility = "visible";
      } else {
        logo.style.display = "none";
      }
      const nameEl = document.getElementById("splashBrandName");
      nameEl.style.display = brand.custom ? "" : "none";
      nameEl.textContent = brand.name;
      document.getElementById("splashPowered").style.display = brand.custom ? "" : "none";
    }
    const cached = getCachedBrand();
    if (cached) showBrand(cached);
    const brandReady = loadPublicBrand().then(showBrand);

    // Wait for the brand too, so the splash never fades out before the logo appears
    // (loadPublicBrand gives up after 3 seconds and uses the default).
    Promise.all([getSessionUser().catch(() => null), brandReady])
      .then(([user]) => finish(user ? "pages/dashboard.html" : "pages/login.html"))
      .catch(() => finish("pages/login.html"));
  </script>
</body>
</html>
