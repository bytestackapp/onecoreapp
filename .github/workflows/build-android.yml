name: Build Android APK

on:
  workflow_dispatch:   # only runs when you manually click "Run workflow" in the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate env-config.js from secrets
        run: node scripts/generate-env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Sync web files into www
        run: |
          mkdir -p www
          cp -r css www/
          cp -r js www/
          cp -r pages www/
          cp -r images www/
          cp favicon.png www/
          cp index.html www/

      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Write signing keystore from secret
        run: echo "${{ secrets.ONECORE_DEBUG_KEYSTORE_B64 }}" | base64 -d > android/app/onecore-debug.keystore

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
        env:
          ONECORE_KEYSTORE_PASSWORD: ${{ secrets.ONECORE_KEYSTORE_PASSWORD }}

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: onecore
          path: android/app/build/outputs/apk/release/onecore.apk
