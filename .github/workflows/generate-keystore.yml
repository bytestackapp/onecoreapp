name: Generate Debug Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore onecore-debug.keystore \
            -storepass onecoreDebug123 \
            -alias onecoredebugkey \
            -keypass onecoreDebug123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OneCore Debug,O=OneCore,C=PH"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: onecore-debug-keystore
          path: onecore-debug.keystore
